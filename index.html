<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summer Blooms</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

<header class="header">
  <h1 class="header__logo-text">Summer Blooms</h1>

  <img src="img/logo.png" alt="Summer Blooms Logo" class="header__logo-image">

  <nav class="nav" aria-label="Main Navigation">
    <ul class="nav__list">
      <li><a href="index.html" class="nav__link active">Home</a></li>
      <li><a href="about.html" class="nav__link">About</a></li>
      <li><a href="projects.html" class="nav__link">Shop</a></li>
      <li><a href="contacts.html" class="nav__link">Contact</a></li>
    </ul>
  </nav>
</header>

<main>

<section class="hero" aria-label="Hero Section">
  <div class="hero__content">
    <h2 class="hero__title">Handcrafted Floral Art</h2>
    <p class="hero__text">Fuzzy wire & satin ribbon bouquets made with love</p>
    <a href="projects.html" class="shop-button">Shop Now</a>
  </div>
</section>

<section class="gallery" aria-label="Featured Creations">
  <h2 class="gallery__title">Featured Creations</h2>

  <div class="gallery__grid">

    <article class="gallery__card">
      <img src="img/bouquet.jpg" alt="Pink handmade bouquet" class="gallery__image" loading="lazy">
      <p class="gallery__overlay">Sunflower and Roses Bouquets</p>
    </article>

    <article class="gallery__card">
      <img src="img/bouquet2.jpg" alt="Floral ribbon arrangement" class="gallery__image" loading="lazy">
      <p class="gallery__overlay">Small Bouquets</p>
    </article>

    <article class="gallery__card">
      <img src="img/bouquet3.jpg" alt="Decorative fuzzy wire flowers" class="gallery__image" loading="lazy">
      <p class="gallery__overlay">Mother's Day Bouquets</p>
    </article>

    <article class="gallery__card">
      <img src="img/bouquet4.jpg" alt="Pastel bouquet collection" class="gallery__image" loading="lazy">
      <p class="gallery__overlay">Satin Rose and Tulips Bouquet</p>
    </article>

  </div>
</section>

</main>

<footer class="footer">
  <p>© 2026 Summer Blooms</p>
</footer>

</body>
</html>
